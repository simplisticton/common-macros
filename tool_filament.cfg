#####################################################################
# Tool filament load / unload
#   heat -> T<n> -> MAINTENANCE -> retract 4 x 100 mm (or extrude 3 x 100 mm)
#
# Usage:
#   UNLOAD_TOOL_FILAMENT TOOL=Tool0 TEMP=245
#   LOAD_TOOL_FILAMENT   TOOL=Tool0 TEMP=245
#
# Moves are 100 mm each because max_extrude_only_distance = 100.
# The heater is left on when finished, so you can unload, swap, then load.
#####################################################################

[gcode_macro UNLOAD]
description: Heat, select and park a tool, then retract its filament. Usage: UNLOAD_TOOL_FILAMENT TOOL=Tool0 TEMP=245
variable_min_temp: 180
gcode:
  {% set tool_name = params.TOOL|default("")|string %}
  {% set temp = params.TEMP|default(0)|float %}
  {% set key = "tool " ~ tool_name %}
  {% if key not in printer %}
    { action_raise_error("UNLOAD: unknown TOOL '" ~ tool_name ~ "' (example: TOOL=Tool0)") }
  {% endif %}
  {% if temp < min_temp %}
    { action_raise_error("UNLOAD: TEMP must be at least " ~ min_temp ~ " (example: TEMP=245)") }
  {% endif %}
  {% set tool = printer[key] %}

  # Start heating first so it warms up during the tool change
  SET_HEATER_TEMPERATURE HEATER={tool.extruder} TARGET={temp}
  T{tool.tool_number}
  MAINTENANCE
  RESPOND MSG="Waiting for {tool_name} to reach {temp|int}C"
  TEMPERATURE_WAIT SENSOR={tool.extruder} MINIMUM={temp - 2}

  SAVE_GCODE_STATE NAME=_TOOL_FILAMENT_STATE
  M83
  G1 E-100 F300
  G1 E-100 F300
  G1 E-100 F300
  G1 E-100 F1000
  M400
  RESTORE_GCODE_STATE NAME=_TOOL_FILAMENT_STATE
  RESPOND MSG="{tool_name}: filament unloaded. Heater left at {temp|int}C."

[gcode_macro LOAD]
description: Heat, select and park a tool, then feed filament into it. Usage: LOAD_TOOL_FILAMENT TOOL=Tool0 TEMP=245
variable_min_temp: 180
gcode:
  {% set tool_name = params.TOOL|default("")|string %}
  {% set temp = params.TEMP|default(0)|float %}
  {% set key = "tool " ~ tool_name %}
  {% if key not in printer %}
    { action_raise_error("LOAD: unknown TOOL '" ~ tool_name ~ "' (example: TOOL=Tool0)") }
  {% endif %}
  {% if temp < min_temp %}
    { action_raise_error("LOAD: TEMP must be at least " ~ min_temp ~ " (example: TEMP=245)") }
  {% endif %}
  {% set tool = printer[key] %}

  SET_HEATER_TEMPERATURE HEATER={tool.extruder} TARGET={temp}
  T{tool.tool_number}
  MAINTENANCE
  RESPOND MSG="Waiting for {tool_name} to reach {temp|int}C"
  TEMPERATURE_WAIT SENSOR={tool.extruder} MINIMUM={temp - 2}

  SAVE_GCODE_STATE NAME=_TOOL_FILAMENT_STATE
  M83
  G1 E100 F1000
  G1 E100 F300
  G1 E100 F300
  M400
  RESTORE_GCODE_STATE NAME=_TOOL_FILAMENT_STATE
  RESPOND MSG="{tool_name}: filament loaded. Heater left at {temp|int}C."
